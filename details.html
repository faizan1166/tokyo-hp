    <!-- Script to dynamically load contents -->
    <script>
      const params = new URLSearchParams(window.location.search);
      const title = params.get('title') || '城下町公園';
      const image = params.get('image') || 'assets/card1.png';
      const locationLabel = params.get('location') || 'KYOTO';
      const address = params.get('address') || '京都府亀岡市◯◯';
      const tagsString = params.get('tags') || 'エリア,エリア';

      // Update text details
      document.getElementById('details-title').textContent = title;
      document.getElementById('details-hero-img').style.backgroundImage = `url('${image}')`;
      document.getElementById('details-hero-loc').textContent = locationLabel;
      document.getElementById('details-address-text').textContent = address;
      
      // Update page dynamic title
      document.title = `TOKI — ${title}`;

      // Build Tags
      const tagsContainer = document.getElementById('details-tags-container');
      tagsContainer.innerHTML = '';
      tagsString.split(',').forEach(tag => {
        if (tag.trim()) {
          const span = document.createElement('span');
          span.className = 'details-tag-pill';
          span.textContent = tag.trim();
          tagsContainer.appendChild(span);
        }
      });

      // Update map link
      const mapBtn = document.getElementById('google-map-btn');
      mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(title + ' ' + address)}`;

      // Share function
      const shareBtn = document.getElementById('share-btn');
      shareBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (navigator.share) {
          navigator.share({
            title: `TOKI — ${title}`,
            text: `${title} - ${address}`,
            url: window.location.href
          }).catch(err => console.log(err));
        } else {
          navigator.clipboard.writeText(window.location.href).then(() => {
            alert('リンクをクリップボードにコピーしました！');
          }).catch(err => {
            console.error('Failed to copy text: ', err);
          });
        }
      });
    </script>

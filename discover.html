<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TOKI — Discover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Noto+Serif+JP:wght@200..900&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <img src="assets/tokyo-hp-logo.png" alt="TOKI" class="header-logo">
    </header>

    <div class="container discover">
      <section class="hero" style="background-image: url('https://images.unsplash.com/photo-1522383507783-6b66a3e49401?w=1200&h=800&fit=crop');">
        <div class="hero-content">
          <h1 class="hero-title">DISCOVER</h1>
        </div>
      </section>

      <section class="search-discover">
        <div class="discover-search-wrapper">
            <input type="text" placeholder="キーワードで検索" >
            <button type="submit"><img src="./assets/search-discover.png"/></button>
        </div>

      </section>

       <section class="category-section">
        <h2>CATEGORY</h2>

        <div class="cateogory-wrapper">
          <div class="category-card">
            <img src="./assets/eat-icon.svg" />
            <span class="">EAT</span>
          </div>

            <div class="category-card">
            <img src="./assets/stay-icon.svg" />
            <span class="">STAY</span>
          </div>

            <div class="category-card">
            <img src="./assets/play-icon.svg" />
            <span class="">PLAY</span>
          </div>

            <div class="category-card">
            <img src="./assets/local-icon.svg" />
            <span class="">LOCAL</span>
          </div>
        </div>
      </section>

      <section class="section" style="margin-top: 20px;">
        <div class="section-header">
          <div class="section-label-group">
            <h2 class="section-heading">泊まることで、旅は深くなる</h2>
          </div>
        </div>

        <div class="cards-grid">
          <!-- Reusing the same `.card` markup from index.html -->
          <article class="card">
            <div class="card-image" style="background-image: url('assets/card1.png');">
              <div class="card-overlay">
                <span class="like-count"><img src="./assets/heart-fav.svg" />  91</span>
                <div class="card-copy">
                  <span class="location-label">KYOTO</span>
                  <span class="card-text">文章が入ります</span>
                </div>
              </div>
            </div>
          </article>


            <article class="card">
            <div class="card-image" style="background-image: url('assets/card-5.png');">

            </div>
          </article>

                <span class="like-count"><img src="./assets/heart-fav.svg" />  91</span>
                <div class="card-copy">
                  <span class="location-label">KYOTO</span>
                  <span class="card-text">文章が入ります</span>

            </div>
          </article>

        </div>
      </section>
    </div>

    <footer class="site-footer">
        <img src="assets/tokyo-hp-logo.png" alt="TOKI" class="footer-logo">
    </footer>

    <nav class="bottom-nav">
      <a class="nav-item" href="index.html">
        <img src="assets/home.svg" alt="home">
        <span>トップ</span>
      </a>

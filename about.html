      <!-- Main Content Section -->

        <p class="about-category">ABOUT</p>
        <h2 class="about-title">TOKI JAPAN <span>について</span></h2>

        <div class="about-text-group">
          <p class="about-paragraph">旅の記憶は、TOKIとともに。</p>
          
          <p class="about-paragraph">
            その土地に流れる時間。<br>
            受け継がれてきた文化や歴史。
          </p>
          
          <p class="about-paragraph">
            地域ごとに異なる風景や暮らし。<br>
            そこに生きる人々の営み。
          </p>
          
          <p class="about-paragraph">そして、旅先で過ごすかけがえのない一時。</p>
          
          <p class="about-paragraph">
            旅とは、場所を訪れるだけではなく、<br>
            その土地に流れる時間に触れ、<br>
            そこでしか味わえない一時を過ごすこと。
          </p>
          
          <p class="about-paragraph">
            TOKI JAPANは、日本各地の風景や文化、暮らしを映像で届けながら、まだ知らない日本との出会いを届けていきます。
          </p>
        </div>

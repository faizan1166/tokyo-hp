<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ログイン — TOKI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Noto+Serif+JP:wght@200..900&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page">
      <div class="auth-card">
        <h2 class="auth-title">ログイン</h2>

        <form action="#" class="auth-form">
          <input type="email" placeholder="メールアドレス" required>
          <input type="password" placeholder="パスワード" required>
          <button class="btn-primary" type="submit">ログイン</button>
        </form>

        <div class="auth-links">
          <a href="#" class="link">パスワードを忘れた方はこちら</a>
          <a href="register.html" class="link">新規会員登録はこちら</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <img src="assets/tokyo-hp-logo.png" alt="TOKI" class="footer-logo">
      </div>
    </footer>

    <nav class="bottom-nav">
      <a class="nav-item" href="index.html">
        <img src="assets/home.svg" alt="home">
        <span>トップ</span>
      </a>
     
      <a class="nav-item" href="discover-new.html">
        <img src="assets/search.svg" alt="search">
        <span>検索</span>
      </a>
       <a class="nav-item" href="#">
        <img src="assets/chat.svg" alt="chat">
                <span>プランナー</span>

      </a>
      <a class="nav-item active" href="login.html">
        <img src="assets/account.svg" alt="account">
        <span>マイページ</span>
      </a>
    </nav>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TOKI — Discover New</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Noto+Serif+JP:wght@200..900&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container discover-new discover">
      <section class="search-discover">
        <div class="discover-search-wrapper">
          <input type="text" placeholder="キーワードで検索" />
          <button type="submit">
            <img src="./assets/search-discover.png" />
          </button>
        </div>
      </section>

      <section class="discover-filter-section">
        <div class="discover-filter-group">
          <p class="discover-filter-title">エリア</p>
          <div class="discover-filter-row">
            <button class="filter-pill active">北海道</button>
            <button class="filter-pill">東北</button>
            <button class="filter-pill">関東</button>
            <button class="filter-pill">中部</button>
            <button class="filter-pill">近畿</button>
            <button class="filter-pill">中国</button>
            <button class="filter-pill">四国</button>
          </div>
        </div>
        <div class="discover-filter-group">
          <p class="discover-filter-title">詳細エリア（都道府県・地域）</p>
          <div class="discover-filter-row">
            <button class="filter-pill active">全て</button>
            <button class="filter-pill">東京都</button>
            <button class="filter-pill">神奈川</button>
            <button class="filter-pill">埼玉</button>
            <button class="filter-pill">千葉</button>
            <button class="filter-pill">栃木</button>
            <button class="filter-pill">茨城</button>
          </div>
        </div>
      </section>

      <section class="category-section">
        <h2>CATEGORY</h2>

        <div class="cateogory-wrapper">
          <div class="category-card">
            <img src="./assets/eat-icon.svg" />
            <span class="">EAT</span>
          </div>

          <div class="category-card">
            <img src="./assets/stay-icon.svg" />
            <span class="">STAY</span>
          </div>

          <div class="category-card">
            <img src="./assets/play-icon.svg" />
            <span class="">PLAY</span>
          </div>

          <div class="category-card">
            <img src="./assets/local-icon.svg" />
            <span class="">LOCAL</span>
          </div>
        </div>
      </section>

      <section class="discover-tab-row">
        <button class="discover-tab active">
            <div class="discover-tabs-name-wrapper">
          <img src="./assets/heart-new.svg" />
          人気
          </div>
        </button>
        <button class="discover-tab">
                        <div class="discover-tabs-name-wrapper">

          <img src="./assets/new.svg" />

          最新
          </div>
        </button>
        <button class="discover-tab">
                        <div class="discover-tabs-name-wrapper">

          <img src="./assets/chatbox.svg" /> 推奨AI
          </div>
        </button>
      </section>

      <section class="section discover-cards-section">
        <div class="cards-grid">
          <article class="card discover-card">
            <div
              class="card-image"
              style="background-image: url(&quot;assets/card1.png&quot;)"
            ></div>
            <div class="discover-card-body">
              <p class="discover-card-title">五重塔</p>
              <div class="discover-card-tags">
                <span>エリア</span>
                <span>エリア</span>
                <span>エリア</span>
              </div>
            </div>
            <button class="card-like"><img src="./assets/heart-fav.svg" /> 91</button>
          </article>
          <article class="card discover-card">
            <div
              class="card-image"
              style="background-image: url(&quot;assets/card2.png&quot;)"
            ></div>
            <div class="discover-card-body">
              <p class="discover-card-title">緑池公園</p>
              <div class="discover-card-tags">
                <span>エリア</span>
                <span>エリア</span>
                <span>エリア</span>
              </div>
            </div>
            <button class="card-like"><img src="./assets/heart-fav.svg" /> 91</button>
          </article>
          <article class="card discover-card">
            <div
              class="card-image"
              style="background-image: url(&quot;assets/card3.png&quot;)"
            ></div>
            <div class="discover-card-body">
              <p class="discover-card-title">桜坂</p>
              <div class="discover-card-tags">
                <span>エリア</span>
                <span>エリア</span>
                <span>エリア</span>
              </div>
            </div>
            <button class="card-like"><img src="./assets/heart-fav.svg" /> 91</button>
          </article>
          <article class="card discover-card">
            <div
              class="card-image"
              style="background-image: url(&quot;assets/card4.png&quot;)"
            ></div>
            <div class="discover-card-body">
              <p class="discover-card-title">スクランブル交差点</p>
              <div class="discover-card-tags">
                <span>エリア</span>
                <span>エリア</span>
                <span>エリア</span>
              </div>
            </div>
            <button class="card-like"><img src="./assets/heart-fav.svg" /> 91</button>
          </article>
          <article class="card discover-card">
            <div
              class="card-image"
              style="background-image: url(&quot;assets/card1.png&quot;)"
            ></div>
            <div class="discover-card-body">
              <p class="discover-card-title">箱根温泉</p>
              <div class="discover-card-tags">
                <span>エリア</span>
                <span>エリア</span>
                <span>エリア</span>
              </div>
            </div>
            <button class="card-like"><img src="./assets/heart-fav.svg" /> 91</button>
          </article>
          <article class="card discover-card">
            <div
              class="card-image"
              style="background-image: url(&quot;assets/card2.png&quot;)"
            ></div>
            <div class="discover-card-body">
              <p class="discover-card-title">魚市場</p>
              <div class="discover-card-tags">
                <span>エリア</span>
                <span>エリア</span>
                <span>エリア</span>
              </div>
            </div>
            <button class="card-like"><img src="./assets/heart-fav.svg" /> 91</button>
          </article>
        </div>
      </section>
    </div>

    <footer class="site-footer">
        <img src="assets/tokyo-hp-logo.png" alt="TOKI" class="footer-logo" />
    </footer>

    <nav class="bottom-nav">
      <a class="nav-item" href="index.html">
        <img src="assets/home.svg" alt="home" />
        <span>トップ</span>
      </a>
      <a class="nav-item active" href="discover-new.html">
        <img src="assets/search.svg" alt="discover" />
        <span>検索</span>
      </a>
      <a class="nav-item" href="#">
        <img src="assets/chat.svg" alt="chat" />
        <span>プランナー</span>
      </a>
      <a class="nav-item" href="login.html">
        <img src="assets/account.svg" alt="account" />
        <span>マイページ</span>
      </a>
    </nav>
  </body>
</html>
